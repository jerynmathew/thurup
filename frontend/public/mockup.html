<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thurup - Neon Nights Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e1b4b', 950: '#020617' },
                        neon: { cyan: '#06b6d4', magenta: '#d946ef', amber: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 80px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: black;
            position: relative;
        }

        .card.red {
            color: #ef4444;
        }

        .card-face {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 12px;
        }

        .card-center {
            font-size: 24px;
        }

        .avatar-ring {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-ring.active {
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }

        .avatar-ring.dealer {
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>

<body class="flex flex-col">
    <!-- Top Bar -->
    <div class="h-16 glass flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded bg-gradient-to-br from-neon-cyan to-neon-magenta flex items-center justify-center font-bold">
                T</div>
            <span class="font-bold text-xl tracking-wide">THURUP</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-white/10 border border-white/10">#royal-flush-99</span>
        </div>
        <div class="flex gap-4">
            <div class="text-right">
                <div class="text-xs text-slate-400">TEAM A</div>
                <div class="font-bold text-neon-cyan">145 PTS</div>
            </div>
            <div class="w-px h-8 bg-white/10"></div>
            <div>
                <div class="text-xs text-slate-400">TEAM B</div>
                <div class="font-bold text-white">82 PTS</div>
            </div>
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="flex-1 relative flex items-center justify-center w-full overflow-hidden">
        <!-- Floating Info Panel (Desktop/Tablet) -->
        <div class="absolute top-4 left-4 glass p-4 rounded-xl w-64 hidden md:block z-20">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-2">Current Round</h3>
            <div class="flex justify-between mb-1">
                <span class="text-sm text-slate-300">Bid Winner</span>
                <span class="text-sm font-bold text-neon-magenta">Alice (22)</span>
            </div>
            <div class="flex justify-between mb-1">
                <span class="text-sm text-slate-300">Trump</span>
                <span class="text-sm font-bold text-red-500">♥ Hearts</span>
            </div>
            <div class="mt-3 pt-3 border-t border-white/5">
                <div class="text-xs text-slate-400 mb-1">TRICKS WON</div>
                <div class="flex gap-1">
                    <div class="h-1.5 flex-1 bg-neon-cyan rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-neon-cyan rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-neon-cyan rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
                    <div class="h-1.5 flex-1 bg-white/10 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Mobile Score Bar (Visible only on small screens) -->
        <div class="absolute top-2 left-0 right-0 flex justify-center md:hidden z-20">
            <div class="glass px-4 py-2 rounded-full flex gap-4 text-xs">
                <span>Bid: <strong class="text-neon-magenta">22 (Alice)</strong></span>
                <span>Trump: <strong class="text-red-500">♥</strong></span>
            </div>
        </div>

        <!-- Game Table -->
        <div
            class="relative w-[90vw] max-w-[600px] aspect-square rounded-full border border-white/5 bg-white/[0.02] backdrop-blur-sm flex items-center justify-center transition-all duration-500">
            <!-- Center Decoration -->
            <div class="absolute inset-0 rounded-full border border-white/5 scale-75"></div>
            <div class="absolute inset-0 rounded-full border border-white/5 scale-50"></div>

            <!-- Center Trick (Increased Separation) -->
            <div class="relative w-full h-full">
                <!-- Top Card -->
                <div class="absolute top-[35%] left-1/2 -translate-x-1/2 -translate-y-1/2 card shadow-lg">
                    <span class="card-face">J♠</span>
                    <span class="card-center">♠</span>
                </div>
                <!-- Right Card -->
                <div class="absolute top-1/2 right-[35%] translate-x-1/2 -translate-y-1/2 card red rotate-90 shadow-lg">
                    <span class="card-face">10♥</span>
                    <span class="card-center">♥</span>
                </div>
                <!-- Bottom Card (Winning) -->
                <div
                    class="absolute bottom-[35%] left-1/2 -translate-x-1/2 translate-y-1/2 card neon-border z-10 shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                    <span class="card-face">J♥</span>
                    <span class="card-center">♥</span>
                </div>
                <!-- Left Card -->
                <div class="absolute top-1/2 left-[35%] -translate-x-1/2 -translate-y-1/2 card -rotate-90 shadow-lg">
                    <span class="card-face">9♣</span>
                    <span class="card-center">♣</span>
                </div>
            </div>

            <!-- Players -->
            <!-- Top -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2">
                <div class="avatar-ring bg-slate-800 w-12 h-12 md:w-16 md:h-16"><span
                        class="font-bold text-sm md:text-base">B</span></div>
                <span
                    class="text-xs md:text-sm font-medium bg-black/50 px-2 py-0.5 rounded-full backdrop-blur-md">Bob</span>
            </div>
            <!-- Right -->
            <div class="absolute top-1/2 right-0 translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2">
                <div class="avatar-ring dealer bg-slate-800 w-12 h-12 md:w-16 md:h-16"><span
                        class="font-bold text-sm md:text-base">C</span></div>
                <span
                    class="text-xs md:text-sm font-medium bg-black/50 px-2 py-0.5 rounded-full backdrop-blur-md">Charlie</span>
            </div>
            <!-- Left -->
            <div class="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2">
                <div class="avatar-ring bg-slate-800 w-12 h-12 md:w-16 md:h-16"><span
                        class="font-bold text-sm md:text-base">D</span></div>
                <span
                    class="text-xs md:text-sm font-medium bg-black/50 px-2 py-0.5 rounded-full backdrop-blur-md">David</span>
            </div>
            <!-- Bottom (Me) -->
            <div
                class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 flex flex-col items-center gap-2 z-20">
                <div class="avatar-ring active bg-slate-800 w-14 h-14 md:w-16 md:h-16"><span
                        class="font-bold text-sm md:text-base">You</span></div>
                <span
                    class="text-xs md:text-sm font-medium text-neon-cyan bg-black/50 px-2 py-0.5 rounded-full backdrop-blur-md">Alice</span>
            </div>
        </div>
    </div>

    <!-- Player Hand -->
    <div class="h-48 relative flex justify-center items-end pb-6 overflow-hidden">
        <div class="absolute bottom-0 w-full h-32 bg-gradient-to-t from-black/80 to-transparent pointer-events-none">
        </div>

        <!-- Action Bar -->
        <div class="absolute bottom-40 flex gap-3 z-30">
            <button
                class="px-6 py-2 rounded-full bg-gradient-to-r from-neon-cyan to-blue-600 font-bold shadow-lg shadow-cyan-500/20 hover:scale-105 transition">PLAY
                J♥</button>
        </div>

        <!-- Cards -->
        <div class="flex -space-x-12 hover:-space-x-8 transition-all duration-300 items-end mb-[-20px] hover:mb-0">
            <div
                class="card transform -rotate-12 translate-y-4 hover:-translate-y-8 transition-transform duration-200 cursor-pointer">
                <span class="card-center">7♠</span></div>
            <div
                class="card transform -rotate-6 translate-y-2 hover:-translate-y-8 transition-transform duration-200 cursor-pointer red">
                <span class="card-center">K♦</span></div>
            <div
                class="card transform rotate-0 hover:-translate-y-8 transition-transform duration-200 cursor-pointer border-2 border-neon-cyan shadow-[0_0_15px_rgba(6,182,212,0.4)] z-10">
                <span class="card-center">J♥</span></div>
            <div
                class="card transform rotate-6 translate-y-2 hover:-translate-y-8 transition-transform duration-200 cursor-pointer">
                <span class="card-center">A♠</span></div>
            <div
                class="card transform rotate-12 translate-y-4 hover:-translate-y-8 transition-transform duration-200 cursor-pointer red">
                <span class="card-center">9♥</span></div>
        </div>
    </div>
</body>

</html>
